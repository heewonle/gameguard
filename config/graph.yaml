# 3단 그래프 설정 (개발 월드에서만 조정)
edges:
  min_edge_gold: 30000    # 계정 쌍 사이 대가 없는 골드 합 하한 (부계정→본계정 송금 합은 중앙값 6~7만)
  min_market_ratio: 10    # 거래소 구매는 시세의 10배 이상일 때만 이전으로 본다
  max_group: 30           # 주 IP·기기 공유 그룹 최대 크기 (이보다 크면 공용)

fanin:                    # 신원 공유 그룹 안의 송금 집중
  min_group: 4            # 가족 공유(2~3명)는 제외
  min_senders: 3          # 같은 그룹에서 한 계정에게 골드를 몰아주는 계정 수
  min_share: 0.7          # 보낸 계정의 대가 없는 송금 중 그 한 계정에게 간 비율

propagation:              # 1·2단 경보를 씨앗으로 한 개인화 PageRank
  alpha: 0.85
  w_transfer_per_log10: 1.0   # 이동 간선 가중치 = log10(골드) × 이 값
  w_ip: 2.0
  w_device: 3.0
  min_score_ratio: 0.7    # 새 경보: 연결 가중치 중 씨앗(1·2단 경보) 쪽 비율이 이 이상 (개발 월드에서 0.5→0.7)
  min_seed_neighbors: 1   # 씨앗과 직접 연결된 계정만 (2단계 이상 떨어진 길드원 확산 방지)
